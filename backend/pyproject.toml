[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mangjiudaihuo-backend"
version = "0.1.0"
description = "AI 漫剧/带货 系列生产平台 - 后端"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "yufe99" }]
keywords = ["ai", "video", "animation", "tiktok", "douyin", "short-drama"]

dependencies = [
    # Web framework
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",

    # DB
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",

    # Auth
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",

    # AI providers
    "httpx>=0.27",
    "openai>=1.30",
    "anthropic>=0.25",

    # 图像 / 视频处理
    "pillow>=10.3",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",

    # Utility
    "tenacity>=8.2",        # 重试
    "structlog>=24.1",      # 结构化日志
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "ipython>=8.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true